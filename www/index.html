<!DOCTYPE html>

<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rumi 40">
<meta name="theme-color" content="#FFDFF0">
<title>Rumi's 40th</title>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

:root {
  --cream: #FFF8F3;
  --blush: #FFE1EE;
  --pink: #F9A8D4;
  --hotpink: #EC4899;
  --lavender: #C9B8ED;
  --purple: #8B5CF6;
  --plum: #4C2A6E;
  --ink: #43305C;
  --gold: #F5C518;
  --peach: #FFE9C7;
  --sky: #C7E6F7;
  --mint: #DCEBC4;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

body {
  font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--cream);
  color: var(--ink);
  min-height: 100vh;
  min-height: 100dvh;
  overflow: hidden;
  position: fixed;
  width: 100%;
  height: 100%;
}

/* ===== SPLASH ===== */
#splash {
  position: fixed; inset: 0; z-index: 1000;
  background: linear-gradient(160deg, #FFD3E9 0%, #E7D9FA 40%, #CDE9FB 78%, #FFE9C7 110%);
  background-size: 220% 220%;
  animation: gradientShift 14s ease infinite;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  transition: opacity 0.8s ease, transform 0.8s ease;
  overflow: hidden;
}
#splash.hide { opacity: 0; transform: scale(1.08); pointer-events: none; }
@keyframes gradientShift {
  0%, 100% { background-position: 0% 0%; }
  50% { background-position: 100% 100%; }
}
.splash-balloons { position: absolute; inset: 0; pointer-events: none; }
.splash-balloon {
  position: absolute; bottom: -12%;
  animation: rise linear infinite;
  opacity: 0.85;
}
@keyframes rise {
  0%   { transform: translate(0, 0) rotate(-4deg); }
  25%  { transform: translate(14px, -34vh) rotate(4deg); }
  50%  { transform: translate(-12px, -68vh) rotate(-4deg); }
  75%  { transform: translate(14px, -100vh) rotate(4deg); }
  100% { transform: translate(0, -132vh) rotate(-2deg); }
}
.splash-inner {
  position: relative; z-index: 2;
  display: flex; flex-direction: column; align-items: center;
  padding: 0 24px; text-align: center;
  animation: fadeUp 0.9s ease both 0.15s;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(26px); }
  to   { opacity: 1; transform: none; }
}
.hero40 {
  font-family: 'Fraunces', Georgia, serif;
  font-weight: 700;
  font-size: clamp(110px, 34vw, 170px);
  line-height: 0.95;
  background: linear-gradient(135deg, #EC4899 5%, #8B5CF6 55%, #F5C518 110%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 12px 26px rgba(139, 92, 246, 0.35));
  animation: heroFloat 3.4s ease-in-out infinite;
  margin-bottom: 6px;
}
@keyframes heroFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}
#splash h1 {
  font-family: 'Fraunces', Georgia, serif;
  font-weight: 600;
  font-size: clamp(1.7em, 7vw, 2.3em);
  color: var(--plum);
  margin-bottom: 10px;
}
#splash .subtitle {
  font-size: 1.05em; font-weight: 600; color: #6B5388;
  margin-bottom: 34px; max-width: 320px; line-height: 1.55;
}
#splash button {
  position: relative; overflow: hidden;
  background: linear-gradient(135deg, var(--hotpink), var(--purple));
  color: #fff; border: none; border-radius: 999px;
  padding: 17px 46px; font-family: 'Nunito', sans-serif;
  font-size: 1.15em; font-weight: 800; cursor: pointer;
  box-shadow: 0 14px 34px rgba(236, 72, 153, 0.42);
  transition: transform 0.2s;
}
#splash button:active { transform: scale(0.95); }
#splash button::after {
  content: ''; position: absolute; top: 0; left: -60%;
  width: 40%; height: 100%;
  background: linear-gradient(100deg, transparent, rgba(255,255,255,0.55), transparent);
  animation: shine 3.2s ease infinite;
}
@keyframes shine {
  0% { left: -60%; }
  55%, 100% { left: 130%; }
}

/* ===== APP SHELL ===== */
#app { display: none; height: 100vh; height: 100dvh; flex-direction: column; }
#app.show { display: flex; }

.header {
  padding: calc(var(--safe-top) + 12px) 16px 12px;
  background: linear-gradient(135deg, #FFDFF0, #E3D3FA);
  text-align: center;
  flex-shrink: 0;
  box-shadow: 0 2px 14px rgba(139, 92, 246, 0.10);
}
.header h2 {
  font-family: 'Fraunces', Georgia, serif;
  font-weight: 700; font-size: 1.45em;
  background: linear-gradient(135deg, #B03A88, #6D3FBF);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}

.tabs {
  display: flex; gap: 6px; padding: 8px 10px;
  background: rgba(255, 255, 255, 0.78);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(236, 72, 153, 0.12);
  flex-shrink: 0;
}
.tab {
  flex: 1; min-width: 0; padding: 9px 4px 7px; text-align: center; cursor: pointer;
  font-size: 0.75em; font-weight: 800; color: #A491BB;
  border-radius: 16px; transition: all 0.25s;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.tab.active {
  color: var(--plum);
  background: linear-gradient(135deg, #FDE7F3, #EFE7FC);
  box-shadow: 0 4px 14px rgba(139, 92, 246, 0.16);
}
.tab-icon { font-size: 1.8em; }
.tab span:last-child { font-size: 0.95em; letter-spacing: 0.04em; }

.content {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
}
.page { display: none; height: 100%; }
.page.active { display: flex; flex-direction: column; animation: pageIn 0.35s ease; }
@keyframes pageIn {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: none; }
}

/* ===== ALBUM ===== */
.album-container {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; padding: 16px; position: relative;
}
.album-frame {
  background: linear-gradient(#fff, #fff) padding-box,
              linear-gradient(135deg, var(--pink), var(--lavender), var(--gold)) border-box;
  border: 3px solid transparent;
  border-radius: 24px; padding: 12px;
  box-shadow: 0 16px 40px rgba(139, 92, 246, 0.18);
  max-width: 90%; position: relative; overflow: hidden;
}
.album-frame img {
  width: 100%; border-radius: 14px; display: block;
  max-height: 55vh; object-fit: contain;
}
.album-caption {
  text-align: center; padding: 12px 4px 4px; font-size: 0.95em;
  font-weight: 600; color: #7A5E96; font-style: italic;
}
.album-empty {
  background: linear-gradient(rgba(255,255,255,0.92), rgba(255,255,255,0.92)) padding-box,
              linear-gradient(135deg, var(--pink), var(--lavender), var(--gold)) border-box;
  border: 3px solid transparent;
  border-radius: 24px; padding: 44px 32px; text-align: center;
  box-shadow: 0 16px 40px rgba(139, 92, 246, 0.18); max-width: 320px;
  font-size: 1.05em; font-weight: 600; line-height: 1.6; color: var(--ink);
}
.album-empty .big { font-size: 3em; display: block; margin-bottom: 12px; }
.album-nav {
  display: flex; justify-content: center; align-items: center; gap: 20px;
  padding: 16px; flex-shrink: 0;
}
.album-btn {
  width: 52px; height: 52px; border-radius: 50%; border: none;
  background: rgba(255, 255, 255, 0.9);
  box-shadow: 0 6px 18px rgba(236, 72, 153, 0.18);
  font-size: 1.4em; color: var(--plum); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.2s;
}
.album-btn:active { transform: scale(0.9); }
.album-counter { font-size: 0.9em; color: #A491BB; font-weight: 800; min-width: 60px; text-align: center; }
.album-dots {
  display: flex; justify-content: center; gap: 6px; padding-bottom: 8px; flex-wrap: wrap;
  max-width: 300px; margin: 0 auto;
}
.album-dot {
  width: 8px; height: 8px; border-radius: 50%; background: #E8DCF2; transition: all 0.3s;
}
.album-dot.active { background: var(--hotpink); transform: scale(1.35); }

/* ===== GAME ===== */
.game-container {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; padding: 20px; gap: 18px;
}
.wheel-wrapper {
  position: relative; width: 300px; height: 300px;
}
.wheel-pointer {
  position: absolute; top: -20px; left: 50%; transform: translateX(-50%);
  font-size: 2em; z-index: 10; color: var(--hotpink);
  filter: drop-shadow(0 3px 6px rgba(236, 72, 153, 0.35));
}
.wheel-canvas {
  width: 300px; height: 300px;
  border-radius: 50%;
  box-shadow: 0 20px 46px rgba(139, 92, 246, 0.28),
              inset 0 0 0 8px #fff,
              0 0 0 4px var(--gold);
  transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
}
.spin-btn {
  position: relative; overflow: hidden;
  background: linear-gradient(135deg, var(--hotpink), var(--purple));
  color: white; border: none; border-radius: 999px; padding: 16px 42px;
  font-family: 'Nunito', sans-serif; font-size: 1.15em; font-weight: 800; cursor: pointer;
  box-shadow: 0 12px 30px rgba(236, 72, 153, 0.4);
  transition: transform 0.2s;
}
.spin-btn::after {
  content: ''; position: absolute; top: 0; left: -60%;
  width: 40%; height: 100%;
  background: linear-gradient(100deg, transparent, rgba(255,255,255,0.5), transparent);
  animation: shine 3.4s ease infinite;
}
.spin-btn:active { transform: scale(0.95); }
.spin-btn:disabled { opacity: 0.55; cursor: not-allowed; }
.game-result {
  background: linear-gradient(rgba(255,255,255,0.94), rgba(255,255,255,0.94)) padding-box,
              linear-gradient(135deg, var(--pink), var(--lavender)) border-box;
  border: 2px solid transparent;
  border-radius: 22px; padding: 20px 22px; text-align: center;
  max-width: 90%; box-shadow: 0 10px 30px rgba(139, 92, 246, 0.14);
  min-height: 84px; display: flex; align-items: center; justify-content: center;
  font-size: 1em; font-weight: 600; line-height: 1.55; color: var(--ink);
}
.game-category {
  font-size: 0.72em; font-weight: 800; text-transform: uppercase;
  letter-spacing: 1.6px; color: var(--hotpink); margin-bottom: 7px;
}

/* ===== CONFETTI ===== */
.confetti-piece {
  position: fixed; width: 10px; height: 10px; z-index: 999;
  animation: confettiFall 3s ease forwards;
  pointer-events: none;
}
@keyframes confettiFall {
  0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
  100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
}

/* ===== FLOATING BACKGROUND ===== */
.floating-bg {
  position: fixed; inset: 0; pointer-events: none; z-index: -1; overflow: hidden;
}
.floating-item {
  position: absolute; bottom: -10%; font-size: 20px; opacity: 0.32;
  animation: rise linear infinite;
}
.float40 {
  font-family: 'Fraunces', Georgia, serif; font-weight: 700;
  background: linear-gradient(135deg, var(--hotpink), var(--purple));
  -webkit-background-clip: text; background-clip: text; color: transparent;
  opacity: 0.4;
}

/* ===== WISDOM ===== */
.quotes-container {
  display: flex; flex-direction: column; align-items: center; padding: 22px 20px; gap: 20px;
}
.quotes-deck {
  width: 100%; max-width: 340px;
}
.quote-card {
  width: 100%; min-height: 290px; position: relative;
  background: linear-gradient(rgba(255,255,255,0.95), rgba(255,255,255,0.95)) padding-box,
              linear-gradient(135deg, var(--pink), var(--lavender), var(--gold)) border-box;
  border: 3px solid transparent;
  border-radius: 26px; box-shadow: 0 18px 44px rgba(139, 92, 246, 0.18);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 40px 28px 30px; box-sizing: border-box;
}
.quote-card::before {
  content: '\201C';
  font-family: 'Fraunces', Georgia, serif;
  font-size: 5.2em; line-height: 1;
  color: rgba(236, 72, 153, 0.16);
  position: absolute; top: 10px; left: 20px;
}
.quote-text {
  font-family: 'Fraunces', Georgia, serif;
  font-weight: 500; font-style: italic;
  font-size: 1.18em; color: var(--ink);
  line-height: 1.6; text-align: center; margin-bottom: 18px;
  opacity: 1; transition: opacity 0.3s ease;
}
.quote-text.fade { opacity: 0; }
.quote-source {
  font-size: 0.8em; color: #9B7FB8; font-weight: 800;
  letter-spacing: 0.06em; text-transform: uppercase;
  text-align: center; opacity: 1; transition: opacity 0.3s ease;
}
.quote-source.fade { opacity: 0; }
.quotes-controls {
  display: flex; align-items: center; gap: 18px;
}
.quote-btn {
  background: var(--blush); border: none; padding: 11px 22px;
  border-radius: 999px; font-family: 'Nunito', sans-serif;
  font-size: 0.95em; color: var(--plum);
  font-weight: 800; cursor: pointer;
  box-shadow: 0 4px 14px rgba(236, 72, 153, 0.14);
}
.quote-btn:active { transform: scale(0.95); }
.quote-counter {
  font-size: 0.9em; color: #A491BB; font-weight: 800;
}
.quote-shuffle-btn {
  background: linear-gradient(135deg, var(--pink), var(--lavender));
  border: none; padding: 13px 30px; border-radius: 999px;
  font-family: 'Nunito', sans-serif;
  font-size: 1em; color: var(--plum); font-weight: 800;
  cursor: pointer; box-shadow: 0 8px 22px rgba(139, 92, 246, 0.22);
}
.quote-shuffle-btn:active { transform: scale(0.95); }
</style>
</head>
<body>

<div class="floating-bg" id="floatingBg"></div>

<div id="splash">
  <div class="splash-balloons" id="splashBalloons"></div>
  <div class="splash-inner">
    <div class="hero40">40</div>
    <h1>Happy Birthday, Rumi! &#x1F49C;</h1>
    <p class="subtitle">A little birthday gift with all our love &#x2728; and a sprinkle of Provence sunshine &#x2600;&#xFE0F;</p>
    <button onclick="openApp()">Open Your Gift &#x1F381;</button>
  </div>
</div>

<div id="app">
  <div class="header">
    <h2>&#x1F382; Rumi's 40th &#x1F382;</h2>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('album')" id="tab-album">
      <span class="tab-icon">&#x1F4F8;</span>
      <span>Album</span>
    </div>
    <div class="tab" onclick="switchTab('game')" id="tab-game">
      <span class="tab-icon">&#x1F3A1;</span>
      <span>Game</span>
    </div>
    <div class="tab" onclick="switchTab('quotes')" id="tab-quotes">
      <span class="tab-icon">&#x2728;</span>
      <span>Wisdom</span>
    </div>
  </div>

  <div class="content">
    <div class="page active" id="page-album">
      <div class="album-container" id="albumContainer">
        <div class="album-frame" id="albumFrame">
          <img id="albumImg" src="" alt="Family photo">
          <div class="album-caption" id="albumCaption"></div>
        </div>
      </div>
      <div class="album-dots" id="albumDots"></div>
      <div class="album-nav" id="albumNav">
        <button class="album-btn" onclick="prevPhoto()">&#x25C0;</button>
        <span class="album-counter" id="albumCounter"></span>
        <button class="album-btn" onclick="nextPhoto()">&#x25B6;</button>
      </div>
    </div>

    <div class="page" id="page-game">
      <div class="game-container">
        <div class="wheel-wrapper">
          <div class="wheel-pointer">&#x25BC;</div>
          <canvas class="wheel-canvas" id="wheelCanvas" width="300" height="300"></canvas>
        </div>
        <button class="spin-btn" id="spinBtn" onclick="spinWheel()">&#x1F389; Spin the Wheel! &#x1F389;</button>
        <div class="game-result" id="gameResult">
          <div>Spin the wheel to get a question!<br>
          <small>(Everyone answers. No dodging. Birthday girl's rules.)</small></div>
        </div>
      </div>
    </div>

    <div class="page" id="page-quotes">
      <div class="quotes-container">
        <div class="quotes-deck" id="quotesDeck">
          <div class="quote-card" id="quoteCard">
            <div class="quote-text" id="quoteText"></div>
            <div class="quote-source" id="quoteSource"></div>
          </div>
        </div>
        <div class="quotes-controls">
          <button class="quote-btn" onclick="prevQuote()">&#x25C0; Prev</button>
          <span class="quote-counter" id="quoteCounter"></span>
          <button class="quote-btn" onclick="nextQuote()">Next &#x25B6;</button>
        </div>
        <button class="quote-shuffle-btn" onclick="shuffleQuotes()">&#x1F500; Shuffle</button>
      </div>
    </div>
  </div>
</div>

// ===== ALBUM =====
let currentPhoto = 0;

function initAlbum() {
  if (PHOTOS.length === 0) {
    document.getElementById('albumContainer').innerHTML =
      '<div class="album-empty"><span class="big">&#x1F4F8;</span>' +
      'Family photos are on their way...<br>check back very soon! &#x1F49C;</div>';
    document.getElementById('albumNav').style.display = 'none';
    return;
  }
  const dots = document.getElementById('albumDots');
  if (PHOTOS.length > 20) {
    dots.style.display = 'none';
  } else {
    dots.innerHTML = PHOTOS.map((_, i) =>
      `<div class="album-dot ${i === 0 ? 'active' : ''}" onclick="goToPhoto(${i})"></div>`
    ).join('');
  }
  showPhoto(0);
}

function showPhoto(idx) {
  currentPhoto = idx;
  const img = document.getElementById('albumImg');
  img.style.opacity = '0';
  setTimeout(() => {
    img.src = PHOTOS[idx];
    img.style.opacity = '1';
    img.style.transition = 'opacity 0.3s';
  }, 150);
  document.getElementById('albumCaption').textContent = CAPTIONS[idx % CAPTIONS.length];
  document.getElementById('albumCounter').textContent = `${idx + 1} / ${PHOTOS.length}`;
  document.querySelectorAll('.album-dot').forEach((d, i) => d.classList.toggle('active', i === idx));
}

function nextPhoto() { showPhoto((currentPhoto + 1) % PHOTOS.length); }
function prevPhoto() { showPhoto((currentPhoto - 1 + PHOTOS.length) % PHOTOS.length); }
function goToPhoto(i) { showPhoto(i); }

let touchStartX = 0;
document.getElementById('page-album').addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
});
document.getElementById('page-album').addEventListener('touchend', e => {
  if (PHOTOS.length === 0) return;
  const diff = touchStartX - e.changedTouches[0].clientX;
  if (Math.abs(diff) > 50) { diff > 0 ? nextPhoto() : prevPhoto(); }
});

let isSpinning = false;
let currentRotation = 0;

function drawWheel() {
  const canvas = document.getElementById('wheelCanvas');
  const ctx = canvas.getContext('2d');
  const cx = 150, cy = 150, r = 145;
  const sliceAngle = (2 * Math.PI) / CATEGORIES.length;

  ctx.clearRect(0, 0, 300, 300);

  CATEGORIES.forEach((cat, i) => {
    const startAngle = i * sliceAngle - Math.PI / 2;
    const endAngle = startAngle + sliceAngle;

    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, startAngle, endAngle);
    ctx.closePath();
    ctx.fillStyle = cat.color;
    ctx.fill();
    ctx.strokeStyle = 'white';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.save();
    ctx.translate(cx, cy);
    const midAngle = startAngle + sliceAngle / 2;
    ctx.rotate(midAngle);
    const flip = Math.cos(midAngle) < 0;
    if (flip) ctx.rotate(Math.PI);
    const dir = flip ? -1 : 1;
    ctx.textAlign = 'center';
    ctx.fillStyle = '#4A3728';
    ctx.font = 'bold 13px -apple-system, sans-serif';
    ctx.fillText(cat.emoji, dir * r * 0.55, 5);
    ctx.font = '11px -apple-system, sans-serif';

    const words = cat.name.split(' ');
    if (words.length > 1) {
      ctx.fillText(words[0], dir * r * 0.75, -3);
      ctx.fillText(words.slice(1).join(' '), dir * r * 0.75, 10);
    } else {
      ctx.fillText(cat.name, dir * r * 0.75, 4);
    }
    ctx.restore();
  });

  ctx.beginPath();
  ctx.arc(cx, cy, 25, 0, 2 * Math.PI);
  ctx.fillStyle = 'white';
  ctx.fill();
  ctx.strokeStyle = '#F5C518';
  ctx.lineWidth = 3;
  ctx.stroke();
  ctx.fillStyle = '#4A3728';
  ctx.font = 'bold 18px -apple-system, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('40', cx, cy);
}

function spinWheel() {
  if (isSpinning) return;
  isSpinning = true;
  document.getElementById('spinBtn').disabled = true;

  const extraSpins = 5 + Math.floor(Math.random() * 5);
  const randomAngle = Math.random() * 360;
  const totalRotation = extraSpins * 360 + randomAngle;
  currentRotation += totalRotation;

  const canvas = document.getElementById('wheelCanvas');
  canvas.style.transform = `rotate(${currentRotation}deg)`;

  setTimeout(() => {
    isSpinning = false;
    document.getElementById('spinBtn').disabled = false;

    const normalizedAngle = (360 - (currentRotation % 360)) % 360;
    const sliceAngle = 360 / CATEGORIES.length;
    const catIndex = Math.floor(normalizedAngle / sliceAngle);
    const category = CATEGORIES[catIndex];

    const questions = QUESTIONS[category.name];
    const question = questions[Math.floor(Math.random() * questions.length)];

    document.getElementById('gameResult').innerHTML =
      `<div><div class="game-category">${category.emoji} ${category.name}</div>${question}</div>`;

    spawnConfetti();
  }, 4200);
}

function spawnConfetti() {
  const colors = ['#F9A8D4', '#EC4899', '#C9B8ED', '#8B5CF6', '#F5C518', '#FFD1E3', '#C7E6F7'];
  for (let i = 0; i < 30; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random() * 100 + 'vw';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    piece.style.width = (6 + Math.random() * 8) + 'px';
    piece.style.height = (6 + Math.random() * 8) + 'px';
    piece.style.animationDuration = (2 + Math.random() * 2) + 's';
    piece.style.animationDelay = (Math.random() * 0.5) + 's';
    document.body.appendChild(piece);
    setTimeout(() => piece.remove(), 4000);
  }
}

let currentQuoteIndex = 0;
let quotesOrder = [...Array(QUOTES.length).keys()];

function showQuote(idx) {
  const q = QUOTES[quotesOrder[idx]];
  const textEl = document.getElementById('quoteText');
  const sourceEl = document.getElementById('quoteSource');
  textEl.textContent = '“' + q.text + '”';
  sourceEl.textContent = '— ' + q.source;
  document.getElementById('quoteCounter').textContent = (idx + 1) + ' / ' + QUOTES.length;
}

function fadeToQuote(idx) {
  const textEl = document.getElementById('quoteText');
  const sourceEl = document.getElementById('quoteSource');
  textEl.classList.add('fade');
  sourceEl.classList.add('fade');
  setTimeout(() => {
    showQuote(idx);
    textEl.classList.remove('fade');
    sourceEl.classList.remove('fade');
  }, 300);
}

function nextQuote() {
  currentQuoteIndex = (currentQuoteIndex + 1) % QUOTES.length;
  fadeToQuote(currentQuoteIndex);
}

function prevQuote() {
  currentQuoteIndex = (currentQuoteIndex - 1 + QUOTES.length) % QUOTES.length;
  fadeToQuote(currentQuoteIndex);
}

function shuffleQuotes() {
  for (let i = quotesOrder.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [quotesOrder[i], quotesOrder[j]] = [quotesOrder[j], quotesOrder[i]];
  }
  currentQuoteIndex = 0;
  fadeToQuote(0);
}

// Init quotes on load
document.addEventListener('DOMContentLoaded', () => {
  showQuote(0);
});

// Service Worker
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
